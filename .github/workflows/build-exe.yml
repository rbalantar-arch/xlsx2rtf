name: Construir EXE para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Empaquetar Xlsx2RTF.exe
        run: python -m PyInstaller --noconsole --onefile --clean --name Xlsx2RTF xlsx2rtf_gui.py

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Xlsx2RTF-windows
          path: dist/Xlsx2RTF.exe
